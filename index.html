<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home in the Crater</title>
<meta name="description" content="A junior astronaut mission trainer: run a Moon or Mars outpost through real solar storms from NASA data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b1a;
    --panel: #111834;
    --panel2: #182246;
    --line: #2a3566;
    --text: #f2f5ff;
    --muted: #9aa6d1;
    --accent: #ffc23d;
    --o2: #5ad1ff;
    --food: #7be07b;
    --rad: #ff6b8b;
    --sci: #c79bff;
    --pow: #ffc23d;
    --shield: #6ea8ff;
    --bad: #ff6b6b;
    --good: #6be29a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff9 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 10%, #fff8 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 70%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 85%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 55%, #fff8 50%, transparent 51%);
    color: var(--text);
    font-family: "Baloo 2", system-ui, -apple-system, sans-serif;
    font-size: 18px;
    line-height: 1.4;
    min-height: 100vh;
  }
  button, input { font: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 14px; color: var(--muted); }
  .ghost { background: none; border: 2px solid var(--line); color: var(--text); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .screen { display: none; }
  .screen.active { display: block; animation: pop .4s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { font-size: clamp(38px, 7vw, 64px); line-height: 1; margin: 18px 0 6px; }
  h1 span { color: var(--accent); }
  h2 { font-size: 28px; margin: 24px 0 10px; }
  .lead { color: var(--muted); font-size: 20px; margin: 0 0 14px; }
  .live { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 #6be29a88; animation: pulse 1.6s infinite; }
  @keyframes pulse { to { box-shadow: 0 0 0 10px transparent; } }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 3px solid var(--line); border-radius: 20px; padding: 16px; cursor: pointer; text-align: left; color: var(--text); }
  .card:hover { border-color: var(--muted); }
  .card[aria-pressed="true"] { border-color: var(--accent); background: var(--panel2); }
  .card .big { font-size: 40px; line-height: 1; }
  .card h3 { margin: 6px 0 4px; font-size: 22px; }
  .card ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 16px; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
  .card input { margin-top: 8px; background: var(--bg); border: 2px solid var(--line); color: var(--text); border-radius: 10px; padding: 6px 10px; width: 100%; }
  .primary { background: var(--accent); color: #261a00; border: 0; border-radius: 16px; padding: 14px 26px; font-size: 22px; font-weight: 800; cursor: pointer; }
  .primary:hover { filter: brightness(1.07); }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .msg { color: var(--bad); min-height: 1.4em; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }

  /* game */
  .hud { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-top: 10px; }
  .scene { position: relative; border-radius: 20px; overflow: hidden; border: 3px solid var(--line); aspect-ratio: 16 / 10; background: #000; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .week { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .week b { font-size: 30px; }
  .week small { color: var(--muted); font-size: 15px; }
  .meters { display: grid; gap: 8px; margin-top: 10px; }
  .meter { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
  .meter .ic { font-size: 26px; text-align: center; }
  .bar { height: 18px; background: var(--panel2); border-radius: 999px; overflow: hidden; position: relative; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 999px; transition: width .6s ease; }
  .bar .limit { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; opacity: .8; }
  .meter .val { font-weight: 800; min-width: 92px; text-align: right; font-size: 16px; }
  .meter .lab { font-size: 13px; color: var(--muted); grid-column: 2 / 4; margin-top: -6px; }
  .alert { margin-top: 12px; border-radius: 16px; padding: 12px 14px; font-size: 17px; }
  .alert.storm { background: #4a1020; border: 2px solid var(--rad); }
  .alert.calm { background: var(--panel); border: 2px solid var(--line); color: var(--muted); }
  .alloc { margin-top: 14px; background: var(--panel); border: 3px solid var(--line); border-radius: 20px; padding: 14px; }
  .alloc h3 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pips { display: flex; gap: 4px; flex-wrap: wrap; }
  .pip { width: 22px; height: 22px; border-radius: 6px; background: var(--pow); box-shadow: inset 0 -3px 0 #0003; }
  .pip.off { background: var(--panel2); box-shadow: none; }
  .slot { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .slot:first-of-type { border-top: 0; }
  .slot .ic { font-size: 30px; text-align: center; }
  .slot .name { font-weight: 800; }
  .slot .eff { font-size: 14px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--panel2); color: var(--text); font-size: 26px; font-weight: 800; cursor: pointer; }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper output { min-width: 28px; text-align: center; font-size: 24px; font-weight: 800; }
  .endturn { width: 100%; margin-top: 12px; }

  /* result + modal */
  .modal { position: fixed; inset: 0; background: #070b1ad9; display: none; place-items: center; padding: 16px; z-index: 20; }
  .modal.active { display: grid; }
  .sheet { background: var(--panel); border: 3px solid var(--line); border-radius: 24px; padding: 20px; max-width: 560px; width: 100%; max-height: 92vh; overflow: auto; }
  .sheet h2 { margin: 0 0 8px; }
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .real { background: #2a1030; border: 2px solid var(--rad); border-radius: 16px; padding: 12px; margin: 12px 0; }
  .real b { color: var(--rad); }
  .fact { background: var(--panel2); border-radius: 14px; padding: 10px 12px; margin-top: 12px; font-size: 16px; }
  .fact b { color: var(--accent); }
  .src { font-size: 13px; color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }
  .chip { background: var(--panel2); border-radius: 14px; padding: 8px 10px; font-size: 16px; }
  .chip b { font-size: 22px; display: block; }
  .chip.bad { background: #4a1020; }
  .factcard { background: linear-gradient(135deg, #2a1f55, #1a2a55); border: 2px solid var(--sci); border-radius: 16px; padding: 12px; margin: 12px 0; }
  .factcard .fi { font-size: 34px; float: left; margin-right: 10px; }
  .factcard b { color: var(--sci); }
  details.mini { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .event { margin-top: 12px; background: linear-gradient(135deg, #1d2a5c, #2a1d5c); border: 3px solid var(--accent); border-radius: 18px; padding: 12px 14px; }
  .event h4 { margin: 0; font-size: 22px; }
  .event p { margin: 4px 0; }
  .event .fact { margin-top: 6px; font-size: 15px; }
  .evbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .evbtns button { background: var(--panel2); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 10px; cursor: pointer; text-align: left; font-size: 16px; }
  .evbtns button:hover { border-color: var(--accent); }
  .evbtns small { display: block; color: var(--accent); font-size: 14px; }
  .evdone { margin-top: 8px; font-weight: 800; color: var(--good); }
  .timeline { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin-top: 8px; }
  .timeline span { aspect-ratio: 1; border-radius: 6px; background: var(--panel2); display: grid; place-items: center; font-size: 13px; }
  .timeline span.now { outline: 3px solid var(--accent); }
  .timeline span.past { background: #24305e; }
  .score { font-weight: 800; color: var(--accent); }
  .banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: clamp(30px, 6vw, 54px); font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0008; animation: banner 1.6s ease forwards; pointer-events: none; white-space: nowrap; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
  .delta { display: inline-block; margin-left: 6px; font-size: 14px; font-weight: 800; padding: 0 6px; border-radius: 999px; animation: delta 2.4s ease forwards; }
  .delta.up { background: #1f5c3a; color: #b9ffd2; }
  .delta.down { background: #5c1f2a; color: #ffc4cf; }
  @keyframes delta { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  .stars { font-size: clamp(44px, 9vw, 72px); letter-spacing: 6px; margin: 6px 0 0; }
  .stars .off { filter: grayscale(1); opacity: .25; }
  .rank { display: inline-block; background: var(--accent); color: #261a00; font-weight: 800; border-radius: 999px; padding: 4px 14px; font-size: 18px; }
  .breakdown td:last-child { text-align: right; font-weight: 800; }
  .best { color: var(--good); font-weight: 800; }
  a { color: var(--o2); }

  /* report */
  .verdict { font-size: clamp(34px, 6vw, 52px); margin: 10px 0 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
  .stat { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px; border-left: 6px solid var(--c); }
  .stat .k { font-size: 14px; color: var(--muted); }
  .stat .v { font-size: 28px; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; margin-top: 8px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 800px) { .hud { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">NASA Space Apps 2026 · Junior Astronaut Mission Trainer</span>
    <span class="row" style="margin:0">
      <span class="live" id="liveSun"><span class="dot"></span><span id="liveSunText">…</span></span>
      <button class="ghost" id="langBtn" type="button">EN</button>
    </span>
  </header>

  <!-- 1. Setup -->
  <section id="setup" class="screen active">
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>

    <h2 data-i18n="pickSite"></h2>
    <div class="cards" id="siteCards">
      <button class="card" type="button" data-site="moon" aria-pressed="true">
        <div class="big">🌙</div>
        <h3 data-i18n="moonName"></h3>
        <ul><li data-i18n="moonF1"></li><li data-i18n="moonF2"></li><li data-i18n="moonF3"></li></ul>
      </button>
      <button class="card" type="button" data-site="mars" aria-pressed="false">
        <div class="big">🔴</div>
        <h3 data-i18n="marsName"></h3>
        <ul><li data-i18n="marsF1"></li><li data-i18n="marsF2"></li><li data-i18n="marsF3"></li></ul>
      </button>
    </div>

    <h2 data-i18n="pickSun"></h2>
    <div class="cards" id="sunCards">
      <div class="card" role="button" tabindex="0" data-sun="random" aria-pressed="true">
        <div class="big">🎲</div>
        <h3 data-i18n="sunRandom"></h3>
        <p data-i18n="sunRandomP"></p>
      </div>
      <div class="card" role="button" tabindex="0" data-sun="birthday" aria-pressed="false">
        <div class="big">🎂</div>
        <h3 data-i18n="sunBirthday"></h3>
        <p data-i18n="sunBirthdayP"></p>
        <input type="date" id="bday" min="1976-01-01">
      </div>
      <div class="card" role="button" tabindex="0" data-sun="live" aria-pressed="false">
        <div class="big">📡</div>
        <h3 data-i18n="sunLive"></h3>
        <p data-i18n="sunLiveP"></p>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="startBtn" type="button" data-i18n="start"></button>
      <span class="msg" id="setupMsg" role="alert"></span>
    </div>
  </section>

  <!-- 2. Briefing -->
  <section id="brief" class="screen">
    <h1 data-i18n="briefTitle"></h1>
    <p class="lead" id="briefSub"></p>
    <div class="cards">
      <div class="card" style="cursor:default"><div class="big">⚡</div><h3 data-i18n="b1t"></h3><p id="b1p"></p></div>
      <div class="card" style="cursor:default"><div class="big">🫁🍅</div><h3 data-i18n="b2t"></h3><p data-i18n="b2p"></p></div>
      <div class="card" style="cursor:default"><div class="big">☀️🛡️</div><h3 data-i18n="b3t"></h3><p id="b3p"></p></div>
      <div class="card" style="cursor:default"><div class="big">🔬</div><h3 data-i18n="b4t"></h3><p id="b4p"></p></div>
    </div>
    <div class="row"><button class="primary" id="goBtn" type="button" data-i18n="go"></button></div>
  </section>

  <!-- 3. Game -->
  <section id="game" class="screen">
    <div class="hud">
      <div>
        <div class="week"><b id="weekLbl"></b><small id="dateLbl"></small></div>
        <div class="week"><small id="levelLbl"></small><span class="score" id="scoreLbl"></span></div>
        <div class="scene" id="scene"></div>
        <div class="timeline" id="timeline" aria-hidden="true"></div>
        <div id="alertBox"></div>
      </div>
      <div>
        <div class="meters" id="meters"></div>
        <div class="alloc">
          <h3><span data-i18n="allocTitle"></span><span class="pips" id="pips"></span></h3>
          <div id="slots"></div>
          <button class="primary endturn" id="endTurn" type="button" data-i18n="endTurn"></button>
        </div>
      </div>
    </div>
    <p id="live" class="sr" aria-live="polite"></p>
  </section>

  <!-- 4. Report -->
  <section id="report" class="screen">
    <p class="tag" data-i18n="reportTag"></p>
    <h1 class="verdict" id="verdict"></h1>
    <div class="stars" id="stars"></div>
    <p><span class="rank" id="rank"></span> <span id="bestLbl"></span></p>
    <p class="lead" id="verdictSub"></p>
    <table class="breakdown" id="breakdown"></table>
    <div class="grid2" id="repStats"></div>
    <h2 data-i18n="realStorms"></h2>
    <div id="stormTable"></div>
    <h2 data-i18n="discoveries"></h2>
    <div id="factList"></div>
    <h2 data-i18n="learned"></h2>
    <ul id="lessons"></ul>
    <div class="row">
      <button class="primary" id="againBtn" type="button" data-i18n="again"></button>
    </div>
    <details style="margin-top:24px">
      <summary data-i18n="howReal"></summary>
      <div id="howRealBody"></div>
    </details>
  </section>

  <footer id="footer"></footer>
</div>

<div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resTitle">
  <div class="sheet">
    <h2 id="resTitle"></h2>
    <div id="resBody"></div>
    <div class="row"><button class="primary" id="nextBtn" type="button" data-i18n="next"></button></div>
  </div>
</div>

<script>

let liveSun = null;
async function loadLiveSun() {

    const j = await r.json();
    const x = j[0];
    liveSun = { cls: x.max_class || x.current_class, when: x.max_time || x.time_tag };
  } catch { liveSun = false; }

}
function renderLiveSun() {

  const mood = c === "X" ? t("moodStorm") : c === "M" ? t("moodActive") : t("moodCalm");
  $("#liveSunText").textContent = t("liveSun", { cls: liveSun.cls, mood });
}

const MODULES = [10, 20, 30, 40, 50, 60];   // science points that add a new piece to the outpost
const WEEKS = 16, LIMIT = 250, BAT_MAX = 4, O2_MAX = 10, FOOD_MAX = 14;
const SHIELD_STORM = [1, 0.5, 0.25, 0.1];      // storm dose multiplier for 0..3 shield power
const SHIELD_BASE = [1, 0.9, 0.8, 0.7];        // cosmic rays are much harder to block
const WATCH_COST = 4;                          // one-time cost of the Mars sun-watcher satellite
const FACT_EVERY = 10;                         // a real NASA finding unlocks every 10 science points
const stormDose = pfu => 10 * Math.pow(2, Math.log10(Math.max(10, pfu)) - 1);

let setup = { site: "moon", sun: "random" };
function pressGroup(sel, attr, val) { $$(sel).forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val))); }
$$("#siteCards .card").forEach(b => b.addEventListener("click", () => { setup.site = b.dataset.site; pressGroup("#siteCards .card", "site", setup.site); }));

// deterministic RNG so a mission can be replayed and explained
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}

const ARCHIVE = SEP_ARCHIVE.map(([d, pfu, flare]) => ({ date: parseDay(d), pfu, flare, live: false }));
const ARCHIVE_END = parseDay("2017-12-31");

function archiveEvents(from, to) { return ARCHIVE.filter(e => e.date >= from && e.date < to); }

async function donkiEvents(from, to) {
  // DONKI limits each request to 60 days
  const out = [];
  for (let s = new Date(from); s < to; s = new Date(s.getTime() + 59 * DAY)) {
    const e = new Date(Math.min(to.getTime() - DAY, s.getTime() + 58 * DAY));
    const url = `https://api.nasa.gov/DONKI/SEP?startDate=${s.toISOString().slice(0, 10)}&endDate=${e.toISOString().slice(0, 10)}&api_key=DEMO_KEY`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("DONKI " + r.status);
    const j = await r.json();
    for (const ev of j) out.push({ date: parseDay(ev.eventTime), pfu: null, flare: "", live: true, link: ev.link });
  }
  // several instruments often report the same storm: keep one per day
  const seen = new Set();
  return out.filter(e => { const k = e.date.toISOString().slice(0, 10); if (seen.has(k)) return false; seen.add(k); return true; });
}

function randomWindow(r) {
  const ev = ARCHIVE[Math.floor(r() * ARCHIVE.length)];
  const start = new Date(ev.date.getTime() - Math.floor(r() * 10) * 7 * DAY);
  return start < ARCHIVE[0].date ? ARCHIVE[0].date : start;
}

async function events(from, to) {
  if (to <= ARCHIVE_END) return archiveEvents(from, to);
  const old = from <= ARCHIVE_END ? archiveEvents(from, ARCHIVE_END) : [];
  const live = await donkiEvents(from > ARCHIVE_END ? from : new Date(ARCHIVE_END.getTime() + DAY), to);
  return old.concat(live);
}

$("#startBtn").addEventListener("click", async () => {
  const msg = $("#setupMsg");
  msg.textContent = "";
  const seed = Date.now() & 0xffffffff;
  const r = rng(seed);
  let start, note = "";
  const today = new Date(new Date().toISOString().slice(0, 10) + "T00:00:00Z");
  if (setup.sun === "birthday") {
    const v = $("#bday").value;
    if (!v || parseDay(v) < ARCHIVE[0].date || parseDay(v) > today) { msg.textContent = t("errBday"); return; }
    start = parseDay(v);
  } else if (setup.sun === "live") {
    start = new Date(today.getTime() - WEEKS * 7 * DAY);
  } else {
    start = randomWindow(r);
  }
  let end = new Date(start.getTime() + WEEKS * 7 * DAY);
  if (end > today) { end = today; start = new Date(today.getTime() - WEEKS * 7 * DAY); }
  $("#startBtn").disabled = true;
  msg.style.color = "var(--muted)"; msg.textContent = t("loading");
  let evs;
  try { evs = await events(start, end); }
  catch {
    note = t("liveFail");
    start = randomWindow(r);
    end = new Date(start.getTime() + WEEKS * 7 * DAY);
    evs = archiveEvents(start, end);
  }
  $("#startBtn").disabled = false;
  msg.style.color = ""; msg.textContent = "";
  newGame(setup.site, start, evs, seed, note);
});

/* ================= game state ================= */
let G = null;
function newGame(site, start, evs, seed, note) {
  const S = SITES[site], r = rng(seed ^ 0x9e3779b9);
  const storms = evs.map(e => {
    const week = Math.floor((e.date - start) / (7 * DAY));
    const pfu = e.pfu ?? 100;   // DONKI SEP records carry no peak flux: assume a moderate storm
    return { ...e, week, pfuUsed: pfu, warned: r() < S.warnChance, dose: 0, shield: 0 };
  }).filter(s => s.week >= 0 && s.week < WEEKS);
  // place 5 events on calm weeks (1–14), at least 2 weeks apart, without repeating one
  const pool = EVENTS.filter(e => e.sites.includes(site)).map(e => [r(), e]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const evWeeks = {};
  const candidates = Array.from({ length: WEEKS - 2 }, (_, i) => i + 1).filter(w => !storms.some(s => s.week === w)).map(w => [r(), w]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  for (const w of candidates) {
    if (Object.keys(evWeeks).length >= 5 || !pool.length) break;
    if (Object.keys(evWeeks).some(x => Math.abs(x - w) < 2)) continue;
    evWeeks[w] = { def: pool.shift(), choice: null };
  }
  $("#meters").innerHTML = "";
  G = {
    site, S, start, storms, note,
    week: 0, o2: 8, food: 8, dose: 0, sci: 0, bat: 0,
    plan: { o2: 2, food: 1, shield: 0, sci: 0, watch: 0 },
    harvest: Array(WEEKS + 3).fill(0),
    shieldTotal: 0, lateWarnings: 0, unshieldedDose: 0, usedGreenhouse: false,
    watchProgress: 0, builtWeek: null, factsShown: 0,
    powerMod: Array(WEEKS + 4).fill(0), later: [], events: {}, history: [], prev: null, banner: true,
    over: null
  };
  G.events = evWeeks;
  G.plan.sci = Math.max(0, budget() - 3);
  const siteName = t(site === "moon" ? "moonName" : "marsName");
  const endDate = new Date(start.getTime() + (WEEKS * 7 - 1) * DAY);
  $("#briefSub").textContent = t("briefSub", { site: siteName, from: fmtDate(start), to: fmtDate(endDate) }) + (note ? " · " + note : "");
  $("#b1p").textContent = t("b1p", { p: S.power });
  $("#b3p").textContent = t("b3p", { lim: LIMIT });
  $("#b4p").textContent = t("b4p", { t: S.target });
  if (!storms.length) $("#briefSub").textContent += " · " + t("calmNote");
  show("brief");
}
$("#goBtn").addEventListener("click", () => { show("game"); trimPlan(); renderGame(); });

const budget = () => Math.max(0, G.S.power + G.bat + G.powerMod[G.week]);
function trimPlan() { while (used() > budget()) { const k = ["watch", "sci", "shield", "food", "o2"].find(k => G.plan[k] > 0); if (!k) break; G.plan[k]--; } }
const liveScore = () => G.sci * 10 + G.week * 20;
const used = () => G.plan.o2 + G.plan.food + G.plan.shield + G.plan.sci + G.plan.watch;
const weekStorms = w => G.storms.filter(s => s.week === w);
const isWarned = s => s.warned || (G.builtWeek != null && s.week > G.builtWeek);

      ${(() => { const growing = G.harvest[G.week] + G.harvest[G.week + 1] + G.plan.food * 2; return Array.from({ length: Math.min(6, growing) }, (_, i) => `<circle cx="${18 + i * 17}" cy="${40 - (i % 2) * 7}" r="${5 + Math.min(4, G.harvest[G.week])}" fill="#3fbf4f"/>`).join(""); })()}</g>
    <!-- habitat -->
    <g transform="translate(400 320)">
      <ellipse cx="60" cy="10" rx="${110}" ry="${95}" fill="#6ea8ff" opacity="${glow}"><animate attributeName="opacity" values="${glow};${glow * 0.6};${glow}" dur="2s" repeatCount="indefinite"/></ellipse>
      <path d="M0 60 Q60 -40 120 60Z" fill="#e8ecf5" stroke="#fff" stroke-width="3"/>
      <circle cx="45" cy="35" r="8" fill="#5ad1ff"/><circle cx="75" cy="35" r="8" fill="#5ad1ff"/>

function sceneHTML() {
  const b = G.banner ? `<div class="banner">${t("weekBanner", { n: G.week + 1 })}${weekStorms(G.week).some(isWarned) ? " ☀️" : G.events[G.week] ? " " + G.events[G.week].def.icon : ""}</div>` : "";
  G.banner = false;
  return sceneSVG() + b;
}

function renderMeters() {
  const S = G.S;
  const rows = [
    ["o2", "🫁", t("mO2"), G.o2, O2_MAX, "var(--o2)", `${G.o2}/${O2_MAX}`, 0, true],
    ["food", "🍅", t("mFood"), G.food, FOOD_MAX, "var(--food)", `${G.food}/${FOOD_MAX}`, 0, true],
    ["dose", "☢️", t("mRad"), G.dose, LIMIT * 1.1, "var(--rad)", `${fmtN(G.dose)} mSv`, LIMIT, false],
    ["sci", "🔬", t("mSci"), G.sci, S.target, "var(--sci)", `${G.sci}/${S.target}`, 0, true]
  ];
  const box = $("#meters");
  if (!box.children.length) {
    box.innerHTML = rows.map(([k, ic, , , max, color, , limit]) => `<div class="meter" data-m="${k}"><div class="ic">${ic}</div>
      <div class="bar"><i style="width:0%;--c:${color}"></i>${limit ? `<span class="limit" style="left:${limit / max * 100}%"></span>` : ""}</div>
      <div class="val"></div></div>` + (k === "dose" ? `<div class="meter"><div></div><div class="lab" id="radLab"></div></div>` : "")).join("");
  }
  $("#radLab").textContent = t("mRadLab", { lim: LIMIT });
  for (const [k, , label, val, max, , sub, , goodUp] of rows) {
    const m = box.querySelector(`[data-m="${k}"]`);
    m.querySelector("i").style.width = Math.max(0, Math.min(100, val / max * 100)) + "%";
    let delta = "";
    if (G.prev && G.prev[k] !== val) {
      const dv = val - G.prev[k], good = goodUp ? dv > 0 : dv < 0;
      delta = `<span class="delta ${good ? "up" : "down"}">${dv > 0 ? "+" : "−"}${fmtN(Math.abs(dv), k === "dose" ? 1 : 0)}</span>`;
    }
    m.querySelector(".val").innerHTML = `${label}: ${sub}${delta}`;
  }
  G.prev = { o2: G.o2, food: G.food, dose: G.dose, sci: G.sci };
}

function renderTimeline() {
  $("#timeline").innerHTML = Array.from({ length: WEEKS }, (_, w) => {
    const h = G.history[w];
    const ic = h ? (h.late ? "⏱️" : h.storm ? "☀️" : h.event || "✓") : w === G.week ? (G.events[w] ? "❓" : "•") : "";
    return `<span class="${w === G.week ? "now" : w < G.week ? "past" : ""}">${ic}</span>`;
  }).join("");
  const lvl = MODULES.filter(m => G.sci >= m).length;
  const next = MODULES.find(m => G.sci < m);
  $("#levelLbl").textContent = next != null ? t("level", { n: lvl + 1, next }) : t("levelMax", { n: lvl + 1 });
  $("#scoreLbl").textContent = t("score", { n: fmtN(liveScore()) });
}

function eventHTML() {
  const ev = G.events[G.week];
  if (!ev) return "";
  const L = ev.def[lang];
  const eff = e => {
    const parts = [];
    for (const [off, n] of e.power || []) { if (off === 1 && (e.power.length === 1)) parts.push(t("eNext", { n: (n > 0 ? "+" : "−") + Math.abs(n) })); }
    if (e.power && e.power.length === 2) parts.push(t("eTwo", { n: "−" + Math.abs(e.power[0][1]) }));
    else if (e.power && e.power[0][0] === 0) parts.push(t("eThis", { n: "−" + Math.abs(e.power[0][1]) }));
    if (e.o2) parts.push(`${e.o2 > 0 ? "+" : "−"}${Math.abs(e.o2)} 🫁`);
    if (e.food) parts.push(`+${e.food} 🍅`);
    if (e.sci) parts.push(`${e.sci > 0 ? "+" : "−"}${Math.abs(e.sci)} 🔬`);
    if (e.dose) parts.push(`+${e.dose} mSv ☢️`);
    if (e.harvestHalf) parts.push(t("eHalf"));
    if (e.later) parts.push(t("eLater", { what: e.later.food ? `+${e.later.food} 🍅` : `+${e.later.power} ⚡` }));
    return parts.join(" · ");
  };
  const body = ev.choice
    ? `<div class="evdone">${t("evChose", { c: L[ev.choice] })} (${eff(ev.def[ev.choice])})</div>`
    : `<div class="evbtns"><button type="button" data-ev="a">${L.a}<small>${eff(ev.def.a)}</small></button><button type="button" data-ev="b">${L.b}<small>${eff(ev.def.b)}</small></button></div>`;
  return `<div class="event"><h4>${ev.def.icon} ${L.title}</h4><p>${L.text}</p><div class="fact">${L.fact}</div>${body}</div>`;
}

function applyEffect(e) {
  const w = G.week;
  for (const [off, n] of e.power || []) G.powerMod[w + off] += n;
  if (e.o2) G.o2 = Math.max(0, Math.min(O2_MAX, G.o2 + e.o2));
  if (e.food) G.food = Math.min(FOOD_MAX, G.food + e.food);
  if (e.sci) G.sci = Math.max(0, G.sci + e.sci);
  if (e.dose) G.dose += e.dose;
  if (e.harvestHalf) for (const k of [1, 2]) G.harvest[w + k] = Math.floor(G.harvest[w + k] / 2);
  if (e.later) G.later.push({ week: w + 3, ...e.later });
}

function renderGame() {
  const S = G.S, w = G.week;
  $("#weekLbl").textContent = t("week", { n: w + 1 });
  const ws = new Date(G.start.getTime() + w * 7 * DAY), we = new Date(ws.getTime() + 6 * DAY);
  $("#dateLbl").textContent = t("realDate", { d: `${fmtDate(ws, { day: "numeric", month: "short" })} – ${fmtDate(we)}` });
  $("#scene").innerHTML = sceneHTML();
  renderMeters();
  renderTimeline();
  const warned = weekStorms(w).filter(isWarned);
  let html = "";
  for (const c of G.arrived || []) html += `<div class="alert calm" style="color:var(--good)">${t("cargoArrived", { what: c })}</div>`;
  G.arrived = [];
  if (warned.length) {
    const f = warned[0].flare;
    html += `<div class="alert storm">${t("alertWarn", { flare: f ? t("flareCls", { c: f }) : t("flareUnknown") })}</div>`;
  } else if (!G.events[w]) {
    html += `<div class="alert calm">${t(G.site === "mars" ? "alertCalmMars" : "alertCalm")}</div>`;
  }
  $("#alertBox").innerHTML = html + eventHTML();
  renderAlloc();
  $("#live").textContent = `${$("#weekLbl").textContent}. ${$("#alertBox").textContent}`;
}

function renderAlloc() {
  const B = budget(), U = used();
  $("#pips").innerHTML = Array.from({ length: B }, (_, i) => `<span class="pip${i < B - U ? "" : " off"}" title="⚡"></span>`).join("") + ` <b>${B - U}/${B} ⚡</b>`;
  const shieldTxt = G.plan.shield ? t("sShielde", { p: Math.round(SHIELD_STORM[G.plan.shield] * 100) }) : t("sShielde0");
  const rows = [
    ["o2", "🫁", t("sO2"), t("sO2e", { n: G.plan.o2 }), 6],
    ["food", "🌱", t("sFood"), t("sFoode", { n: G.plan.food, f: G.plan.food * 2 }), 4],
    ["shield", "🛡️", t("sShield"), shieldTxt, 3],
    ["sci", "🔬", t("sSci"), t("sScie", { n: G.plan.sci }), 12]
  ];
  if (G.site === "mars" && G.builtWeek == null)
    rows.push(["watch", "🛰️", t("sWatch"), t("sWatche", { p: G.watchProgress + G.plan.watch, c: WATCH_COST }), WATCH_COST - G.watchProgress]);
  const pending = G.events[G.week] && !G.events[G.week].choice;
  $("#endTurn").disabled = !!pending;
  $("#endTurn").textContent = pending ? t("evWait") : t("endTurn");
  $("#slots").innerHTML = rows.map(([k, ic, name, eff, max]) => `
    <div class="slot">
      <div class="ic">${ic}</div>
      <div><div class="name">${name}</div><div class="eff">${eff}</div></div>
      <div class="stepper">
        <button type="button" data-k="${k}" data-d="-1" aria-label="${name} −" ${G.plan[k] <= 0 ? "disabled" : ""}>−</button>
        <output>${G.plan[k]}</output>
        <button type="button" data-k="${k}" data-d="1" aria-label="${name} +" ${U >= B || G.plan[k] >= max ? "disabled" : ""}>+</button>
      </div>
    </div>`).join("");
}
$("#alertBox").addEventListener("click", e => {
  const b = e.target.closest("button[data-ev]");
  const ev = G && G.events[G.week];
  if (!b || !ev || ev.choice) return;
  ev.choice = b.dataset.ev;
  applyEffect(ev.def[ev.choice]);
  trimPlan();
  $("#alertBox").innerHTML = $("#alertBox").innerHTML.replace(/<div class="event">[\s\S]*$/, "") + eventHTML();
  renderMeters(); renderTimeline(); renderAlloc();
  $("#scene").innerHTML = sceneHTML();
});
$("#slots").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  G.plan[b.dataset.k] += +b.dataset.d;
  renderAlloc();
  if (b.dataset.k === "shield" || b.dataset.k === "food") $("#scene").innerHTML = sceneHTML();
});

/* ================= turn resolution ================= */
$("#endTurn").addEventListener("click", () => {
  const S = G.S, w = G.week, p = { ...G.plan };
  const leftover = budget() - used();
  const o2Before = G.o2, foodBefore = G.food, doseBefore = G.dose, sciBefore = G.sci;
  // oxygen and food
  G.o2 = Math.min(O2_MAX, G.o2 + p.o2) - 2;
  G.harvest[w + 2] += p.food * 2;
  if (p.food) G.usedGreenhouse = true;
  const got = G.harvest[w];
  G.food = Math.min(FOOD_MAX, G.food + got) - 2;
  // radiation
  G.dose += S.baseDay * 7 * SHIELD_BASE[p.shield];
  let cards = "", blocked = 0, lateThisWeek = false;
  for (const s of weekStorms(w)) {
    const full = stormDose(s.pfuUsed) * S.stormMult, dose = full * SHIELD_STORM[p.shield];
    s.dose = dose; s.shield = p.shield;
    G.dose += dose; blocked += full - dose;
    if (!p.shield) G.unshieldedDose += dose;
    if (!isWarned(s)) lateThisWeek = true;
    cards += `<div class="real">☀️ <b>${t("realTitle")}</b> ${t("realBody", {
      date: fmtDate(s.date), pfu: s.pfu != null ? fmtN(s.pfu) : "≥10",
      flare: s.flare ? t("realFlare", { c: s.flare }) : ""
    })}${s.live ? t("realLive") : ""}<details class="mini"><summary>${t("pfuWhat")}</summary>${t("pfuInfo")}</details></div>`;
  }
  if (lateThisWeek) { G.lateWarnings++; cards += `<div class="alert storm">${t("lateLost")}</div>`; }
  // science (lost if the crew had to run for shelter) + sun-watcher + battery
  const sciGain = lateThisWeek ? 0 : p.sci;
  G.sci += sciGain;
  G.shieldTotal += p.shield;
  if (p.watch) {
    G.watchProgress += p.watch;
    if (G.watchProgress >= WATCH_COST && G.builtWeek == null) { G.builtWeek = w; G.plan.watch = 0; cards += `<div class="fact">${t("watchBuilt")}</div>`; }
  }
  G.bat = Math.min(BAT_MAX, leftover);
  const list = FACTS[lang];
  for (; G.factsShown < Math.floor(G.sci / FACT_EVERY) && G.factsShown < list.length; G.factsShown++) {
    const [ic, title, body] = list[G.factsShown];
    cards += `<div class="factcard"><span class="fi">${ic}</span><b>${t("factTitle")}</b><br><b>${title}</b><br>${body}<div class="src">${t("factSrc")}</div></div>`;
  }
  // end conditions
  if (G.o2 <= 0) G.over = { why: t("failO2"), w: w + 1 };
  else if (G.food <= 0) G.over = { why: t("failFood"), w: w + 1 };
  else if (G.dose >= LIMIT) G.over = { why: t("failRad"), w: w + 1 };
  G.o2 = Math.max(0, G.o2); G.food = Math.max(0, G.food);
  const evNow = G.events[w];
  G.history[w] = { storm: weekStorms(w).length > 0, late: lateThisWeek, event: evNow ? evNow.def.icon : "" };

  const d = (a, b, dec = 0) => { const v = b - a; return (v >= 0 ? "+" : "−") + fmtN(Math.abs(v), dec); };
  const chip = (ic, label, delta, now, bad) => `<div class="chip${bad ? " bad" : ""}"><b>${ic} ${delta}</b>${label}: ${now}</div>`;
  const chips = [
    chip("🫁", t("mO2"), d(o2Before, G.o2), G.o2, G.o2 <= 2),
    chip("🍅", t("mFood"), d(foodBefore, G.food) + (got ? ` 🌱` : ""), G.food, G.food <= 2),
    chip("☢️", t("mRad"), d(doseBefore, G.dose, 1), `${fmtN(G.dose)}/${LIMIT}`, G.dose >= LIMIT * 0.8),
    chip("🔬", t("mSci"), "+" + (G.sci - sciBefore), `${G.sci}/${S.target}`, lateThisWeek),
    chip("⭐", t("score", { n: "" }).replace(/[:：]\s*$/, ""), "+" + fmtN((G.sci - sciBefore) * 10 + (G.over ? 0 : 20)), fmtN(G.sci * 10 + (w + 1) * 20), false)
  ];
  if (weekStorms(w).length) chips.push(chip("🛡️", t("rStormShort"), p.shield ? "✓" : "✗", p.shield ? t("rShielded", { s: fmtN(blocked, 1) }) : t("rNoShield"), !p.shield));
  if (G.bat) chips.push(chip("🔋", t("mBat"), "+" + G.bat, G.bat, false));
  $("#resTitle").textContent = t("resTitle", { n: w + 1 });
  $("#resBody").innerHTML = cards + `<div class="chips">${chips.join("")}</div>` +
    (G.over ? `<div class="alert storm" style="margin-top:12px">${G.over.why}</div>` : "");
  $("#resultModal").classList.add("active");
  $("#nextBtn").focus();
});

$("#nextBtn").addEventListener("click", () => {
  $("#resultModal").classList.remove("active");
  if (G.over || G.week === WEEKS - 1) return report();
  G.week++;
  G.arrived = [];
  for (const c of G.later.filter(c => c.week === G.week)) {
    if (c.food) { G.food = Math.min(FOOD_MAX, G.food + c.food); G.arrived.push(`+${c.food} 🍅`); }
    if (c.power) { G.powerMod[G.week] += c.power; G.arrived.push(`+${c.power} ⚡`); }
  }
  G.banner = true;
  // keep the plan, but make sure it still fits this week's power
  trimPlan();
  renderGame();
});

/* ================= report ================= */
function report() {
  const S = G.S;
  if (G.over) { $("#verdict").textContent = t("vFail"); $("#verdictSub").textContent = t("vFailSub", G.over); }
  else if (G.sci >= S.target) { $("#verdict").textContent = t("vWin"); $("#verdictSub").textContent = t("vWinSub"); }
  else { $("#verdict").textContent = t("vSafe"); $("#verdictSub").textContent = t("vSafeSub", { left: S.target - G.sci }); }
  const safe = !G.over, goal = G.sci >= S.target;
  const weeksDone = G.over ? G.over.w : WEEKS;
  const parts = [
    [t("sbSci", { n: G.sci }), G.sci * 10],
    [t("sbWeeks", { n: weeksDone }), weeksDone * 20],
    [t("sbHealth"), safe ? Math.round(Math.max(0, LIMIT - G.dose) * 2) : 0],
    [t("sbRes"), safe ? (G.o2 + G.food) * 5 : 0],
    [t("sbGoal"), safe && goal ? 200 : 0]
  ];
  const total = parts.reduce((a, [, v]) => a + v, 0);
  const stars = safe ? 1 + (goal ? 1 : 0) + (goal && G.dose <= LIMIT * 0.7 ? 1 : 0) : 0;
  $("#stars").innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? "" : "off"}">⭐</span>`).join("") + `<div class="src">${t("starHelp")}</div>`;
  $("#rank").textContent = t("rank" + stars);
  $("#breakdown").innerHTML = parts.map(([k, v]) => `<tr><td>${k}</td><td>${fmtN(v)}</td></tr>`).join("") + `<tr><td><b>${t("sbTotal")}</b></td><td>${fmtN(total)}</td></tr>`;
  let best = 0, isNew = false;
  try {
    const key = "kraterdeki-ev-best-" + G.site;
    best = +(localStorage.getItem(key) || 0);
    if (total > best) { isNew = best > 0; best = total; localStorage.setItem(key, String(total)); }
  } catch { best = total; }
  $("#bestLbl").innerHTML = isNew ? `<span class="best">${t("newBest")}</span>` : t("best", { n: fmtN(best) });
  const stat = (c, k, v) => `<div class="stat" style="--c:${c}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  $("#repStats").innerHTML =
    stat("var(--rad)", t("stDose"), `${fmtN(G.dose)} / ${LIMIT} mSv`) +
    stat("var(--sci)", t("stSci"), `${G.sci} / ${S.target}`) +
    stat("var(--accent)", t("stStorms"), G.storms.length) +
    stat("var(--shield)", t("stShield"), `${G.shieldTotal} ⚡`);
  if (G.storms.length) {
    $("#stormTable").innerHTML = `<table><tr><th>${t("thDate")}</th><th>${t("thPfu")}</th><th>${t("thFlare")}</th><th>${t("thDose")}</th></tr>` +
      G.storms.map(s => `<tr><td>${fmtDate(s.date)}${s.live ? " 📡" : ""}</td><td>${s.pfu != null ? fmtN(s.pfu) : "≥10"}</td><td>${s.flare || "—"}</td><td>${s.week <= G.week ? fmtN(s.dose, 1) + " mSv" : "—"}</td></tr>`).join("") + "</table>";
  } else $("#stormTable").innerHTML = `<p>${t("noStorms")}</p>`;
  const L = [];
  if (G.shieldTotal) L.push(t("lShieldSci", { s: G.shieldTotal }));
  if (G.unshieldedDose > 1) L.push(t("lNoShield", { d: fmtN(G.unshieldedDose, 1) }));
  if (G.builtWeek != null) L.push(t("lWatch"));
  else if (G.lateWarnings) L.push(t("lNoWatch", { n: G.lateWarnings }));
  if (G.usedGreenhouse) L.push(t("lGreen"));
  if (G.site === "mars") L.push(t("lMars"));
  L.push(G.storms.length ? t("lCycle", { n: G.storms.length }) : t("lCalm"));
  $("#lessons").innerHTML = L.map(l => `<li>${l}</li>`).join("");
  const nf = Math.min(FACTS[lang].length, Math.floor(G.sci / FACT_EVERY));
  $("#factList").innerHTML = nf
    ? FACTS[lang].slice(0, nf).map(([ic, title, body]) => `<div class="factcard"><span class="fi">${ic}</span><b>${title}</b><br>${body}</div>`).join("") + `<div class="src">${t("factSrc")}</div>`
    : `<p>${t("noFacts")}</p>`;
  show("report");
}
$("#againBtn").addEventListener("click", () => show("setup"));

applyI18n();
loadLiveSun();
</script>
